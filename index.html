$('#cat').innerHTML='<option value="">ทุกประเภทงาน</option>'+uniq('cat').map(c=>'<option>'+esc(c)+'</option>').join('');
$('#area').innerHTML='<option value="">ทุกพื้นที่</option>'+uniq('area').sort().map(c=>'<option>'+esc(c)+'</option>').join('');
$('#stats').innerHTML='<div><b>'+D.length+'</b><span>รายชื่อทั้งหมด</span></div><div><b>'+uniq('cat').length+'</b><span>ประเภทงาน</span></div><div><b>'+D.filter(v=>v.cat==='แม่บ้านรายวัน').length+'</b><span>แม่บ้าน</span></div>';
function render(){
  const q=$('#q').value.trim().toLowerCase(),c=$('#cat').value,a=$('#area').value;
  const r=D.filter(v=>(!c||v.cat===c)&&(!a||v.area===a)&&(!q||[v.name,v.cat,v.area,v.phone,v.note].join(' ').toLowerCase().includes(q)));
  if(!r.length){$('#list').innerHTML='<div class="tw empty">ไม่พบรายชื่อที่ตรงกับการค้นหา</div>';return}
  $('#list').innerHTML='<div class="tw"><table><thead><tr><th>ชื่อ</th><th>ประเภทงาน / พื้นที่</th><th>เบอร์โทร</th><th class="r">เริ่มต้น</th><th>หมายเหตุ</th></tr></thead><tbody>'+r.map(v=>{
    const t=v.phone.replace(/[^\d+]/g,'');
    return '<tr><td><b>'+esc(v.name)+'</b></td><td>'+esc(v.cat)+'<div class="sub">'+esc(v.area)+'</div></td><td>'+(v.phone?'<a href="tel:'+esc(t)+'">'+esc(v.phone)+'</a>':'<span class="sub">-</span>')+'</td><td class="r">'+(v.rate?thb(v.rate):'<span class="sub">-</span>')+'</td><td class="nt">'+esc(v.note)+'</td></tr>'}).join('')+'</tbody></table></div>';
}
['q','cat','area'].forEach(i=>$('#'+i).addEventListener('input',render));render();
</script></body></html>
